[package]
name = "reflect-capture-host"
version = "0.1.0"
description = "Chrome native-messaging host: spools link captures into the graph's capture inbox (Plan 11)"
edition = "2021"

[[bin]]
name = "reflect-capture-host"
path = "src/main.rs"

[dependencies]
reflect-x-archive = { path = "../../crates/x-archive" }
uuid = { version = "1", features = ["v4", "serde"] }

serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23.1"
dirs = "6.0.0"
tempfile = { workspace = true }
