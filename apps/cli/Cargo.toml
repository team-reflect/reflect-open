[package]
name = "reflect-cli"
version = "0.1.0"
description = "Read/discovery CLI over a Reflect graph (Plan 14)"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reflect-index-schema = { workspace = true }
reflect-graph-paths = { workspace = true }
clap = { workspace = true, features = ["derive"] }
jiff = { workspace = true, features = ["default"] }
sha2 = { workspace = true }
pulldown-cmark = { workspace = true }
saphyr = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reflect-index-schema = { workspace = true, features = ["default"] }
