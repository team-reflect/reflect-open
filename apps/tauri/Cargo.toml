[package]
name = "reflect-open"
# Intentionally frozen: the app version lives in apps/web/package.json and
# tauri.conf.json points at it. The crate is never published, so its version
# has no consumer — freezing it keeps Cargo.lock out of every release diff.
version = "0.0.0"
description = "The Reflect desktop app"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reflect_open_lib"
crate-type = ["rlib"]

[dependencies]

# `devtools` compiles the web inspector into release builds too (it is otherwise
# debug-only), so a shipped app stays debuggable — see `src/devtools.rs`.
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-opener = { workspace = true }
# Decodes `reflect-asset://` request paths (`fs/asset_protocol.rs`); the same
# crate tauri itself uses for its protocol URLs.
percent-encoding = { workspace = true }
# `time` backs the bounded wait in `windows::close_note_windows` (tauri
# already runs on tokio; this only makes the sleep primitive addressable).
tokio = { workspace = true, features = ["time", "sync", "fs", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
reflect-types = { workspace = true, features = ["git2", "rusqlite"] }
reflect-index = { workspace = true }
reflect-graph-io = { workspace = true }
reflect-core = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
# `tracing` has no subscriber here: its `log` feature forwards every event to
# the `log` crate, where `tauri-plugin-log` owns the sinks (see `logging.rs`).
tracing = { workspace = true, features = ["log"] }
log = { workspace = true }
tauri-plugin-log = { workspace = true }
# unsafe-headers lets provider-fetch.ts pass an explicit empty Origin, which
# the plugin treats as "send no Origin header" (see providerFetch's doc).
tauri-plugin-http = { workspace = true, features = ["unsafe-headers"] }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-single-instance = { workspace = true, features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Apple Calendar read-only bridge (`src/calendar.rs`): EventKit through the
# objc2 bindings, trimmed to the classes the modules touch. objc2-app-kit
# backs EKCalendar's NSColor → hex conversion and the Edit menu's Paste and
# Match Style item (`src/menu.rs`).
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
  "std",
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
  "block2",
] }
objc2-event-kit = { workspace = true, features = [
  "std",
  "EKCalendar",
  "EKCalendarItem",
  "EKEvent",
  "EKEventStore",
  "EKObject",
  "EKParticipant",
  "EKSource",
  "EKTypes",
  "block2",
  "objc2-app-kit",
] }
objc2-app-kit = { workspace = true, features = [
  "std",
  "NSApplication",
  "NSColor",
  "NSColorSpace",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSWorkspace",
] }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
reflect-graph-io = { workspace = true, features = ["test-support"] }
# `capability_tests` match the `http:default` scope the way tauri-plugin-http does.
regex = { workspace = true }
urlpattern = { workspace = true }
