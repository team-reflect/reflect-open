[workspace]
resolver = "3"
members = [
  "apps/cli",
  "apps/tauri",
  "apps/native-host",
  "crates/core",
  "crates/ffi",
  "crates/graph-io",
  "crates/git",
  "crates/graph-paths",
  "crates/index",
  "crates/index-schema",
  "crates/index-wasm",
  "crates/types",
  "crates/utils",
  "xtask",
]

[workspace.metadata]
name = "reflect-workspace"

[workspace.package]
authors = ["Reflect App, LLC"]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Every dependency of every member is declared here, once. A member writes
# `{ workspace = true }` and adds only `features` and `optional`. Cargo ignores
# a member's `default-features = false`, so it lives here; a member that needs
# the default features adds `features = ["default"]`.

# Workspace crates
reflect-core = { path = "crates/core" }
reflect-graph-io = { path = "crates/graph-io" }
reflect-graph-paths = { path = "crates/graph-paths" }
reflect-git = { path = "crates/git" }
reflect-index = { path = "crates/index", default-features = false }
reflect-index-schema = { path = "crates/index-schema", default-features = false }
reflect-types = { path = "crates/types" }
reflect-utils = { path = "crates/utils" }

# Third-party crates
apple-native-keyring-store = "1.0.2"
base64 = "0.23.1"
block2 = "0.6.2"
# The library only: the default `clap` feature builds the CLI.
cbindgen = { version = "0.29.4", default-features = false }
clap = "4.6.8"
console_error_panic_hook = "0.1.7"
core-foundation = "0.10.1"
dbus-secret-service-keyring-store = "1.0.1"
dirs = "7.0.0"
dispatch2 = "0.3.1"
expect-test = "1.5.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Everything is vendored/static: libssh2 and openssl must never link against
# homebrew dylibs the distributed app won't have (libssh2-sys only consults
# pkg-config when LIBSSH2_SYS_USE_PKG_CONFIG is set, and vendored-openssl pins
# the rest).
git2 = { version = "0.21.0", default-features = false, features = [
  "https",
  "ssh",
  "vendored-libgit2",
  "vendored-openssl",
] }
http-range-header = "1.0.0"
ignore = "0.4.34"
image = { version = "0.25.10", default-features = false }
infer = "0.22.0"
js-sys = "0.3.103"
# hf-hub 1.0 always pulls in the Xet storage client, which builds aws-lc-sys
# (CMake, and NASM on Windows). The model repo needs only plain HTTP.
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "rustls-tls"] }
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
keyring-core = "1.0.1"
# The default features add OpenMP and llama.cpp's `common` library, which the
# embedding runtime does not use.
llama-cpp-2 = { version = "0.1.161", default-features = false }
llama-cpp-sys-2 = { version = "0.1.161", default-features = false }
log = "0.4.35"
notify-debouncer-full = "0.8.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-contacts = "0.3.2"
objc2-event-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-link-presentation = { version = "0.3.2", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false }
percent-encoding = "2.3.2"
proptest = "1.12.0"
pulldown-cmark = "0.13.6"
reconcile-text = "0.14.3"
regex = "1.13.1"
# reqwest 0.12 rides the exact version tauri-plugin-http already compiles.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rusqlite_migration = "2.9.0"
saphyr = "0.4.0"
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-serde = "=0.0.15"
specta-swift = "=0.0.6"
specta-typescript = "=0.0.15"
specta-util = "=0.0.15"
sqlite-vec = "0.1.9"
sqlite-wasm-rs = { version = "0.6.3", default-features = false, features = ["wasm-bindgen"] }
sqlite-wasm-vec = "0.1.3"
strum = { version = "0.28.0", features = ["derive"] }
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-http = "2.9.0"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"
tempfile = "3.27.0"
tokio = "1.54.1"
tracing = "0.1.44"
trash = "5.3.0"
unicode-normalization = "0.1.26"
urlpattern = "0.6.0"
walkdir = "2.5.0"
wasm-bindgen = "0.2.130"
wasm-bindgen-cli-support = "0.2.130"
windows-native-keyring-store = "1.1.0"
xattr = "1.7.0"
zip = { version = "9.0.5", default-features = false }

[profile.release]
# One codegen unit lets LLVM optimize each crate as a whole: about 10% smaller
# downloads, for slower release builds. Set CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
# for faster local release builds.
codegen-units = 1

# The index for browsers and tests (`crates/index-wasm`), built for size.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true
