# Workspace for all Rust crates: the Tauri desktop shell, the `reflect` CLI,
# the shared index-schema crate, and first-party mobile plugins. One lockfile
# pins one SQLite everywhere — the desktop writer and the CLI reader can
# never skew.
[workspace]
resolver = "2"
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "apps/native-host",
  "crates/graph-io",
  "crates/git",
  "crates/graph-paths",
  "crates/index",
  "crates/index-schema",
  "crates/types",
  "plugins/tauri-plugin-app-store",
  "plugins/tauri-plugin-keyboard",
  "plugins/tauri-plugin-mobile-haptics",
  "plugins/tauri-plugin-recording",
  "plugins/tauri-plugin-web-auth",
]

[workspace.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
sqlite-vec = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
reflect-graph-paths = { path = "crates/graph-paths" }
reflect-types = { path = "crates/types" }
reflect-index = { path = "crates/index" }
reflect-graph-io = { path = "crates/graph-io" }
reflect-git = { path = "crates/git" }
tauri = "2.12.1"
tauri-plugin = { version = "2.7.1", features = ["build"] }
thiserror = "2.0.21"
