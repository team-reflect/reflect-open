name: iOS cross-target probe

# Temporary probe: can clippy check the aarch64-apple-ios target on Linux?
# Runs each workspace crate separately so one failure does not hide the rest.
on:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          targets: aarch64-apple-ios
          cache-key: ios-probe-macos

      - name: Stage stub sidecars
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          for name in reflect reflect-capture-host; do
            for triple in aarch64-apple-ios aarch64-apple-darwin; do
              cp /usr/bin/true "apps/desktop/src-tauri/binaries/$name-$triple"
            done
          done

      - name: Clippy for aarch64-apple-ios
        id: ios
        continue-on-error: true
        run: cargo clippy --all-targets --target aarch64-apple-ios -p reflect-open -p reflect-types -p reflect-graph-paths -p reflect-index-schema -p reflect-index -p reflect-graph-io -p reflect-git -p tauri-plugin-app-store -p tauri-plugin-keyboard -p tauri-plugin-mobile-haptics -p tauri-plugin-recording -p tauri-plugin-web-auth -- -D warnings

      - name: Summary
        run: |
          echo "iOS clippy: ${{ steps.ios.outcome }}" >> "$GITHUB_STEP_SUMMARY"
