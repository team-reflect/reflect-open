name: Likely resolved

# Closes issues and PRs that a maintainer labeled `likely resolved` once they
# go quiet. Only people add or remove `likely resolved`; this workflow only
# manages the `Stale` label. After 5 days without activity it adds `Stale`
# with a notice, and after 5 more quiet days it closes the item. Any comment
# or update in between removes `Stale` and restarts the clock.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would happen
        type: boolean
        default: true

permissions: {}

concurrency:
  group: likely-resolved

jobs:
  close:
    name: Close likely resolved issues and PRs
    runs-on: ubuntu-24.04
    permissions:
      actions: write # cache the processing state between runs
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-labels: likely resolved
          days-before-stale: 5
          days-before-close: 5
          stale-issue-message: >
            This looks fixed and there has been no activity for 5 days. We
            will close it in 5 days. If you still see the problem, please
            comment here.
          stale-pr-message: >
            This looks resolved and there has been no activity for 5 days.
            We will close it in 5 days. Comment here if it should stay open.
          close-issue-reason: completed
          close-issue-message: >
            Closing this because there has been no activity for 5 days after
            the last notice. If you still see the problem, comment here and
            we will reopen it.
          close-pr-message: >
            Closing this because there has been no activity for 5 days after
            the last notice. Comment here if it should stay open.
          operations-per-run: 100
          debug-only: ${{ inputs.dry-run == true }}
