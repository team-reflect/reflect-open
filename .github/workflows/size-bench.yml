# TEMPORARY: compares download sizes before and after this PR. Remove before
# merging.
name: Size bench

on:
  pull_request:
    paths:
      - .github/workflows/size-bench.yml

concurrency:
  group: size-bench
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The master commit this branch starts from: the "base" config.
  BASE_SHA: db3cd0ba4e173e4d996c802f7d6ed8fd523c82bd

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: ${{ matrix.target }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, windows-x64]
        config: [base, new]
        include:
          - target: macos-arm64
            os: xcode-27
            command: pnpm build:macos --target=aarch64-apple-darwin --no-sign
          - target: windows-x64
            os: windows-2025
            command: pnpm build:windows --target=x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.config == 'base' && env.BASE_SHA || github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode
        if: runner.os == 'macOS'

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          cache: false

      - name: Build
        run: ${{ matrix.command }}

      # The DMG commands match createDmg in build-macos.ts, which --no-sign skips.
      - name: Measure
        run: |
          bytes() { wc -c <"$1" | tr -d ' '; }
          report() { echo "BENCH ${{ matrix.target }} ${{ matrix.config }} $1 $2" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "${{ runner.os }}" = macOS ]; then
            app=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app)
            report main_binary "$(bytes "$app/Contents/MacOS/reflect-open")"
            tar -czf "$RUNNER_TEMP/app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
            report updater_archive "$(bytes "$RUNNER_TEMP/app.tar.gz")"
            stage="$RUNNER_TEMP/dmg"
            mkdir -p "$stage"
            ditto "$app" "$stage/$(basename "$app")"
            ln -s /Applications "$stage/Applications"
            size_mb=$(( $(du -sk "$stage" | cut -f1) / 1024 * 2 + 32 ))
            hdiutil create -volname Reflect -srcfolder "$stage" -format UDRW -size "${size_mb}m" "$RUNNER_TEMP/writable.dmg"
            hdiutil convert "$RUNNER_TEMP/writable.dmg" -format UDZO -imagekey zlib-level=9 -o "$RUNNER_TEMP/app.dmg"
            report dmg "$(bytes "$RUNNER_TEMP/app.dmg")"
          else
            report main_binary "$(bytes "$(ls target/*/release/reflect-open.exe)")"
            report installer "$(bytes "$(ls target/*/release/bundle/nsis/*-setup.exe)")"
          fi
