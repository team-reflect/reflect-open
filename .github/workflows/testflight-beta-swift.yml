name: TestFlight beta (Swift shell)

# Builds the Swift shell (apps/ios) of the current master commit as the beta
# flavor and uploads it to the Reflect Beta TestFlight app, without a release.
# The build keeps the version of the last release; its build number (the
# commit count) tells it apart.
#
# `testflight-beta.yml` uploads the Tauri shell to the same app with the same
# build number. App Store Connect takes one build per number, so run only one
# of the two workflows for a commit.

# FIXME: just remove the old testflight-beta.yml and rename testflight-beta-swift.yml into testflight-beta.yml. Also make the comment in this file much shorter and simpler.

on:
  workflow_dispatch:

permissions: {}

jobs:
  testflight:
    name: TestFlight beta (Swift shell)
    # The release_app environment only allows master.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-ios.yml
    with:
      commit: ${{ github.sha }}
      flavor: beta
    secrets:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
