name: CI

on:
  push:
    # master is the only long-lived branch.
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  node-test:
    if: github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit

    name: test-${{ matrix.config.browser }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install ${{ matrix.config.browser }}

      - name: Test
        run: pnpm run test
        env:
          REFLECT_TEST_BROWSER: ${{ matrix.config.browser }}

  rust-lint:
    if: github.event_name != 'merge_group'
    # The Apple checks below need a macOS runner. Pull requests skip them, so
    # they stay on Linux.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: ${{ github.event_name != 'pull_request' && 'aarch64-apple-ios' || '' }}

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Check the Apple Rust bindings. These two checks do not run on pull
      # requests, to keep pull request CI short.
      - name: Check desktop library
        if: github.event_name != 'pull_request'
        run: cargo check -p reflect-open --lib

      # The TestFlight workflow is the only full iOS build, so type-check the
      # iOS target here with the same feature set `tauri ios` builds with.
      - name: Check iOS library
        if: github.event_name != 'pull_request'
        run: cargo check -p reflect-open --lib --target aarch64-apple-ios --no-default-features

  rust-test:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Test
        run: cargo test --workspace

  # A single job for branch protection to require, instead of listing every
  # job (and every matrix entry) as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [node-lint, node-test, rust-lint, rust-test]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && github.event_name != 'merge_group') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
