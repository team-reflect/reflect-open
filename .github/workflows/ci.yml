name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  # On master, run every task instead of skipping it on a turbo cache hit.
  TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw' || 'local:rw,remote:rw' }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      lint-node: ${{ steps.classify.outputs.lint-node }}
      test-node: ${{ steps.classify.outputs.test-node }}
      test-chromium: ${{ steps.classify.outputs.test-chromium }}
      test-webkit: ${{ steps.classify.outputs.test-webkit }}
      test-swift: ${{ steps.classify.outputs.test-swift }}
      test-ios: ${{ steps.classify.outputs.test-ios }}
      lint-rust: ${{ steps.classify.outputs.lint-rust }}
      test-rust: ${{ steps.classify.outputs.test-rust }}
    steps:
      # The merge commit's first parent is the base branch, so the diff
      # against it is the change that the PR brings in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none

      - name: Warm up the pnpm store cache
        uses: ./.github/actions/setup-node
        if: github.ref == 'refs/heads/master'

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft == true }}
          # In a stack, but neither the lowest unmerged PR nor the top PR.
          PR_IS_STACK_MIDDLE: >-
            ${{ github.event.pull_request.stack != null
            && github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref
            && github.event.pull_request.stack.position != github.event.pull_request.stack.size }}
        run: |
          set -euo pipefail

          js_files=(
            '.github/*'
            'patches/*'
            '*.ts'
            '*.tsx'
            '*.js'
            '*.mjs'
            '*.cjs'
            '*.css'
            '*.html'
            '*.json'
            '*.yaml'
            '*.yml'
          )
          rust_files=(
            '.github/*'
            '*.rs'
            '*.toml'
            'Cargo.lock'
            '*.sql'
            'apps/tauri/*.json'
            'apple/Sources/TypesShared/*'
          )
          # The TypeScript tests run the Rust index, built to wasm.
          index_wasm_files=(
            'crates/index/*'
            'crates/index-schema/*'
            'crates/index-wasm/*'
            'crates/types/*'
            'Cargo.lock'
            'Cargo.toml'
            'rust-toolchain.toml'
            'xtask/*'
            '.cargo/config.toml'
          )
          swift_files=(
            '.github/*'
            '*.swift'
            '.swift-format'
            'apple/*'
            'apps/ios/*'
            'apps/safari-extension/*'
            'package.json'
            'scripts/build-ffi.ts'
            'scripts/ios-simulator.ts'
            'scripts/test-ios.ts'
          )

          changed() {
            ! git diff --quiet --no-renames HEAD^1 HEAD -- "$@"
          }

          js=false
          rust=false
          swift=false
          skip_slow=$PR_IS_DRAFT

          if [[ $PR_IS_STACK_MIDDLE == true ]]; then
            echo "In the middle of a stack: the top PR runs the jobs."
          elif [[ $EVENT_NAME != pull_request || $HEAD_REF == release-please--* ]]; then
            js=true
            rust=true
            swift=true
            skip_slow=false
          else
            git diff --name-only --no-renames HEAD^1 HEAD
            if changed "${js_files[@]}" "${index_wasm_files[@]}"; then
              js=true
            fi
            if changed "${rust_files[@]}"; then
              rust=true
            fi
            if changed "${swift_files[@]}"; then
              swift=true
            fi
          fi

          webkit=$js
          ios=$swift
          if [[ $skip_slow == true ]]; then
            webkit=false
            ios=false
          fi

          {
            echo "lint-node=$js"
            echo "test-node=$js"
            echo "test-chromium=$js"
            echo "test-webkit=$webkit"
            echo "test-swift=$swift"
            echo "test-ios=$ios"
            echo "lint-rust=$rust"
            echo "test-rust=$rust"
          } | tee -a "$GITHUB_OUTPUT"

  lint-node:
    needs: [classify]
    if: needs.classify.outputs.lint-node == 'true'
    runs-on: ubuntu-24.04
    environment:
      &sccache-environment # Only master can use `sccache_write`, which holds the read-write S3 key.
      name: ${{ github.ref == 'refs/heads/master' && 'sccache_write' || 'sccache_read' }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with: &setup-rust-s3
          s3-endpoint: ${{ secrets.S3_SCCACHE_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_SCCACHE_BUCKET }}
          s3-access-key-id: ${{ secrets.S3_SCCACHE_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SCCACHE_SECRET_ACCESS_KEY }}

      - name: Verify the generated iOS CSP is current
        run: |
          pnpm gen:ios-csp
          git diff --exit-code apple/Sources/WebHostKit/ContentSecurityPolicy.gen.swift \
            || (echo "::error::ContentSecurityPolicy.gen.swift is stale. Run 'pnpm gen:ios-csp' and commit the result." && exit 1)

      - name: Lint
        run: pnpm turbo run lint --filter=//

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=//

      - name: Build
        run: pnpm run build

  test-node:
    needs: [classify]
    if: needs.classify.outputs.test-node == 'true'
    runs-on: ubuntu-24.04
    environment: *sccache-environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with: *setup-rust-s3

      - name: Test
        run: pnpm turbo run test:node

  test-chromium:
    needs: [classify]
    if: needs.classify.outputs.test-chromium == 'true'
    runs-on: ubuntu-24.04
    environment: *sccache-environment
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: test-chromium (${{ matrix.shard }}/3)
    env:
      REFLECT_TEST_BROWSER: chromium
      # Chromium on Linux does not promptly free the iframe of a finished
      # test file (https://issues.chromium.org/issues/530892387), so one
      # browser process grows by 10 to 30 MB per file and dies near 2.5 GB,
      # which Vitest reports as "Browser connection was closed". Vitest can
      # collect garbage after each file, but only when the temp disk has
      # less free space than this threshold; an unreachable threshold makes
      # it collect every time (about 60 ms per file).
      # Vitest reads this variable: https://github.com/vitest-dev/vitest/blob/v5.0.4/packages/vitest/src/node/pools/browser.ts#L773
      VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '100000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with: *setup-rust-s3

      - name: Install Playwright
        run: pnpm --filter @reflect/web test:install:chromium

      - name: Build the index wasm
        run: pnpm build:index-wasm

      # `--only` passes `--shard` to the test task alone, not to the wasm build.
      - name: Test
        run: pnpm turbo run test:browser --only -- --shard=${{ matrix.shard }}/3

  test-webkit:
    needs: [classify, test-chromium]
    if: needs.classify.outputs.test-webkit == 'true'
    runs-on: xcode-27
    environment: *sccache-environment
    env:
      REFLECT_TEST_BROWSER: webkit
      # Suspected workaround, root cause unknown: WebContent sometimes
      # segfaults in JavaScriptCore JIT code ("The webkit page crashed") in
      # Playwright WebKit builds 2359, 2370 and 2378. Full browser test runs
      # crashed about 1 in 8 times with the JIT and 0 in 15 without it. The
      # `__XPC_` prefix passes the variable to the WebContent XPC service.
      __XPC_JSC_useJIT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with: *setup-rust-s3

      - name: Install Playwright
        run: pnpm --filter @reflect/web test:install:webkit

      - name: Build the index wasm
        run: pnpm build:index-wasm

      # WebKit keeps the memory of every finished test file, so each shard
      # runs in its own Vitest process to restart the browser. `--only` passes
      # `--shard` to the test task alone, not to the wasm build.
      - name: Test browser (shard 1/3)
        run: pnpm turbo run test:browser --only -- --shard=1/3

      - name: Test browser (shard 2/3)
        run: pnpm turbo run test:browser --only -- --shard=2/3

      - name: Test browser (shard 3/3)
        run: pnpm turbo run test:browser --only -- --shard=3/3

  test-swift:
    needs: classify
    if: needs.classify.outputs.test-swift == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode

      - run: swift --version
      - run: swift format --version
      - run: git ls-files -z '*.swift' | xargs -0 swift format format --parallel --in-place
      - run: git ls-files -z '*.swift' | xargs -0 swift format lint --strict --parallel
      - run: git diff --exit-code '*.swift'

      - uses: ./.github/actions/setup-node

      - name: Test apple/
        run: pnpm turbo run test:swift --filter=@reflect/apple

      - name: Build apple/ for the iOS Simulator
        run: pnpm turbo run build:ios-simulator --filter=@reflect/apple

      - name: Build apple/ for iOS devices
        run: pnpm turbo run build:ios-device --filter=@reflect/apple

  test-ios:
    needs: [classify, test-swift]
    if: needs.classify.outputs.test-ios == 'true'
    runs-on: xcode-27
    environment: *sccache-environment
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          cache-targets: 'true'
          s3-endpoint: ${{ secrets.S3_SCCACHE_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_SCCACHE_BUCKET }}
          s3-access-key-id: ${{ secrets.S3_SCCACHE_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.S3_SCCACHE_SECRET_ACCESS_KEY }}

      - uses: ./.github/actions/setup-mise

      - name: Pick the simulator cache key
        id: simulator
        env:
          HASH: ${{ hashFiles('.github/actions/setup-xcode/action.yml', 'mise.toml', 'scripts/ios-simulator.ts') }}
        run: echo "key=ios-simulator-$ImageOS-$ImageVersion-$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore the prepared simulator
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-simulator
          key: ${{ steps.simulator.outputs.key }}

      - name: Prepare the simulator
        if: steps.restore.outputs.cache-hit != 'true'
        run: node scripts/ios-simulator.ts prepare "$RUNNER_TEMP/ios-simulator"

      - name: Save the prepared simulator
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-simulator
          key: ${{ steps.simulator.outputs.key }}

      - name: Build web
        run: pnpm build:web:ios

      - name: Build ffi
        run: pnpm build:ffi:iphonesimulator

      - name: Build and run the tests
        env:
          IOS_SIMULATOR_SNAPSHOT: ${{ runner.temp }}/ios-simulator
        run: pnpm test:ios

      # The result bundle has the screenshots and the steps of each failed test.
      - name: Upload the result bundle and the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ios-results
          path: apps/ios/build/test-ios
          retention-days: 7

  lint-rust:
    needs: classify
    if: needs.classify.outputs.lint-rust == 'true'
    name: lint-rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    environment: *sccache-environment
    # Clippy and the tests never run the desktop sidecars, so drop them from the
    # Tauri config instead of building them (tauri-build and tauri-codegen merge
    # this JSON into the config). `pnpm sidecar` still stages them for dev and
    # release builds.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":null}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-apt

      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-rust
        with: *setup-rust-s3

      - uses: ./.github/actions/setup-node

      # Fails if Cargo.lock is out of date.
      - name: Check Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Clippy
        run: pnpm turbo run lint --filter=reflect-workspace

      # The iOS app links the core crates through `reflect-ffi`.
      - name: Clippy (iOS simulator)
        if: matrix.name == 'macOS'
        run: pnpm turbo run lint:ios --filter=reflect-workspace

      - name: Clippy (wasm)
        if: matrix.name == 'Linux'
        run: pnpm turbo run lint:wasm --filter=reflect-workspace

      - name: Format check
        run: pnpm turbo run format:check --filter=reflect-workspace

      - if: matrix.name == 'Linux'
        uses: ./.github/actions/setup-mise

      # Fails on a dependency that no code uses, in a member or in the root
      # `[workspace.dependencies]`.
      - name: Unused dependencies
        if: matrix.name == 'Linux'
        run: cargo shear

      - name: Verify the generated C header is current
        if: matrix.name == 'Linux'
        run: |
          cargo xtask ffi-header
          git diff --exit-code crates/ffi/include/reflect_core.h \
            || (echo "::error::reflect_core.h is stale. Run 'pnpm build:ffi' and commit the result." && exit 1)

  test-rust:
    needs: classify
    if: needs.classify.outputs.test-rust == 'true'
    runs-on: ubuntu-24.04
    environment: *sccache-environment
    # Clippy and the tests never run the desktop sidecars, so drop them from the
    # Tauri config instead of building them (tauri-build and tauri-codegen merge
    # this JSON into the config). `pnpm sidecar` still stages them for dev and
    # release builds.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":null}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-apt

      - uses: ./.github/actions/setup-rust
        with: *setup-rust-s3

      - uses: ./.github/actions/setup-node

      - name: Test
        run: pnpm turbo run test --filter=reflect-workspace

  # A single job for branch protection to require, instead of listing every
  # job as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs:
      - classify
      - lint-node
      - test-node
      - test-chromium
      - test-swift
      - lint-rust
      - test-rust
      # Not part of `all-green`
      # - test-webkit
      # - test-ios

    steps:
      # A skipped job counts as passed: classify skips jobs on purpose.
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
