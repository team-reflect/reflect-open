name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test-chromium:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    env:
      REFLECT_TEST_BROWSER: chromium
      # Chromium on Linux does not promptly free the iframe of a finished
      # test file (https://issues.chromium.org/issues/530892387), so one
      # browser process grows by 10 to 30 MB per file and dies near 2.5 GB,
      # which Vitest reports as "Browser connection was closed". Vitest can
      # collect garbage after each file, but only when the temp disk has
      # less free space than this threshold; an unreachable threshold makes
      # it collect every time (about 60 ms per file).
      # Vitest reads this variable: https://github.com/vitest-dev/vitest/blob/v5.0.4/packages/vitest/src/node/pools/browser.ts#L773
      VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '100000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop test:install:chromium

      - name: Test
        run: pnpm run test

  # Not part of `all-green`: a WebKit failure does not block merging.
  test-webkit:
    if: github.event_name != 'merge_group'
    runs-on: macos-latest
    env:
      REFLECT_TEST_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop test:install:webkit

      # WebKit keeps the memory of every finished test file, so each shard
      # runs in its own Vitest process to restart the browser.
      - name: Test browser (shard 1/3)
        run: pnpm run test run --project '*browser*' --shard=1/3

      - name: Test browser (shard 2/3)
        run: pnpm run test run --project '*browser*' --shard=2/3

      - name: Test browser (shard 3/3)
        run: pnpm run test run --project '*browser*' --shard=3/3

      - name: Test others
        run: pnpm run test run --project '!*browser*'

  lint-rust:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Test
        run: cargo test --workspace

  # A single job for branch protection to require, instead of listing every
  # job as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [lint-node, test-chromium, lint-rust, test-rust]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && github.event_name != 'merge_group') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
