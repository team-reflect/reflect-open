name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      lint-node: ${{ steps.classify.outputs.lint-node }}
      test-node: ${{ steps.classify.outputs.test-node }}
      test-chromium: ${{ steps.classify.outputs.test-chromium }}
      test-webkit: ${{ steps.classify.outputs.test-webkit }}
      test-swift: ${{ steps.classify.outputs.test-swift }}
      lint-rust: ${{ steps.classify.outputs.lint-rust }}
      test-rust: ${{ steps.classify.outputs.test-rust }}
    steps:
      # The merge commit's first parent is the base branch, so the diff
      # against it is the change that the PR brings in.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft == true }}
          # In a stack, but neither the lowest unmerged PR nor the top PR.
          PR_IS_STACK_MIDDLE: >-
            ${{ github.event.pull_request.stack != null
            && github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref
            && github.event.pull_request.stack.position != github.event.pull_request.stack.size }}
        run: |
          set -euo pipefail

          js_files=(
            '.github/*'
            'patches/*'
            '*.ts'
            '*.tsx'
            '*.js'
            '*.mjs'
            '*.cjs'
            '*.css'
            '*.html'
            '*.json'
            '*.yaml'
            '*.yml'
          )
          rust_files=(
            '.github/*'
            '*.rs'
            '*.toml'
            'Cargo.lock'
            '*.sql'
            'apps/desktop/src-tauri/*.json'
          )
          swift_files=(
            '.github/*'
            '*.swift'
            '.swift-format'
            'apple/*'
            'apps/desktop/src-tauri/safari-extension/*'
          )

          matches() {
            local file=$1
            local pattern
            shift
            for pattern in "$@"; do
              [[ $file == $pattern ]] && return 0
            done
            return 1
          }

          js=false
          rust=false
          swift=false
          if [[ $PR_IS_STACK_MIDDLE == true ]]; then
            echo "In the middle of a stack: the top PR runs the jobs."
          elif [[ $EVENT_NAME != pull_request || $HEAD_REF == release-please--* ]]; then
            js=true
            rust=true
            swift=true
          else
            git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' file; do
              echo "$file"
              if matches "$file" "${js_files[@]}"; then
                js=true
              fi
              if matches "$file" "${rust_files[@]}"; then
                rust=true
              fi
              if matches "$file" "${swift_files[@]}"; then
                swift=true
              fi
            done < "$RUNNER_TEMP/changed-files"
          fi

          {
            echo "lint-node=$js"
            echo "test-node=$js"
            echo "test-chromium=$js"
            echo "test-webkit=$([[ $js == true && $PR_IS_DRAFT == false ]] && echo true || echo false)"
            echo "test-swift=$swift"
            echo "lint-rust=$rust"
            echo "test-rust=$rust"
          } | tee -a "$GITHUB_OUTPUT"

  lint-node:
    needs: classify
    if: needs.classify.outputs.lint-node == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test-node:
    needs: classify
    if: needs.classify.outputs.test-node == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Test
        run: pnpm run test:node

  test-chromium:
    needs: classify
    if: needs.classify.outputs.test-chromium == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: test-chromium (${{ matrix.shard }}/3)
    env:
      REFLECT_TEST_BROWSER: chromium
      # Chromium on Linux does not promptly free the iframe of a finished
      # test file (https://issues.chromium.org/issues/530892387), so one
      # browser process grows by 10 to 30 MB per file and dies near 2.5 GB,
      # which Vitest reports as "Browser connection was closed". Vitest can
      # collect garbage after each file, but only when the temp disk has
      # less free space than this threshold; an unreachable threshold makes
      # it collect every time (about 60 ms per file).
      # Vitest reads this variable: https://github.com/vitest-dev/vitest/blob/v5.0.4/packages/vitest/src/node/pools/browser.ts#L773
      VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '100000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop test:install:chromium

      - name: Test
        run: pnpm run test:browser --shard=${{ matrix.shard }}/3

  # Not part of `all-green`: a WebKit failure does not block merging.
  test-webkit:
    needs: classify
    if: needs.classify.outputs.test-webkit == 'true'
    runs-on: xcode-27
    env:
      REFLECT_TEST_BROWSER: webkit
      # Suspected workaround, root cause unknown: WebContent sometimes
      # segfaults in JavaScriptCore JIT code ("The webkit page crashed") in
      # Playwright WebKit builds 2359, 2370 and 2378. Full browser test runs
      # crashed about 1 in 8 times with the JIT and 0 in 15 without it. The
      # `__XPC_` prefix passes the variable to the WebContent XPC service.
      __XPC_JSC_useJIT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop test:install:webkit

      # WebKit keeps the memory of every finished test file, so each shard
      # runs in its own Vitest process to restart the browser.
      - name: Test browser (shard 1/3)
        run: pnpm run test:browser --shard=1/3

      - name: Test browser (shard 2/3)
        run: pnpm run test:browser --shard=2/3

      - name: Test browser (shard 3/3)
        run: pnpm run test:browser --shard=3/3

  test-swift:
    needs: classify
    if: needs.classify.outputs.test-swift == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-xcode

      - run: swift --version
      - run: swift format --version
      - run: git ls-files -z '*.swift' | xargs -0 swift format format --parallel --in-place
      - run: git ls-files -z '*.swift' | xargs -0 swift format lint --strict --parallel
      - run: git diff --exit-code '*.swift'

      - name: Test apple/
        run: swift test --package-path apple

      - name: Build apple/ for the iOS Simulator
        working-directory: apple
        run: xcodebuild build -scheme ReflectApple-Package -destination 'generic/platform=iOS Simulator' -quiet

  lint-rust:
    needs: classify
    if: needs.classify.outputs.lint-rust == 'true'
    name: lint-rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Clippy and the tests never run the desktop sidecars, so drop them from the
    # Tauri config instead of building them (tauri-build and tauri-codegen merge
    # this JSON into the config). `pnpm sidecar` still stages them for dev and
    # release builds.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":null}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: xcode-27
            args: --target aarch64-apple-darwin --target aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-apt

      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-rust

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.args }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install cargo-shear
        if: matrix.name == 'Linux'
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-shear@1.14.0

      # Fails on a dependency that no code uses, in a member or in the root
      # `[workspace.dependencies]`.
      - name: Unused dependencies
        if: matrix.name == 'Linux'
        run: cargo shear

  test-rust:
    needs: classify
    if: needs.classify.outputs.test-rust == 'true'
    runs-on: ubuntu-24.04
    # Clippy and the tests never run the desktop sidecars, so drop them from the
    # Tauri config instead of building them (tauri-build and tauri-codegen merge
    # this JSON into the config). `pnpm sidecar` still stages them for dev and
    # release builds.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":null}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-apt

      - uses: ./.github/actions/setup-rust

      - name: Test
        run: cargo test --workspace

  # A single job for branch protection to require, instead of listing every
  # job as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs:
      - classify
      - lint-node
      - test-node
      - test-chromium
      - test-swift
      - lint-rust
      - test-rust

    steps:
      # A skipped job counts as passed: classify skips jobs on purpose.
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
