name: CI

on:
  push:
    # master is the only long-lived branch.
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  node-test:
    if: github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit

    name: test-${{ matrix.config.browser }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install ${{ matrix.config.browser }}

      - name: Test
        run: pnpm run test
        env:
          REFLECT_TEST_BROWSER: ${{ matrix.config.browser }}

  rust-lint:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Test
        run: cargo test --workspace

  # The `build-*` jobs check that the release build of each platform still
  # compiles and bundles. They run the release scripts without signing, so
  # they need no secrets and upload nothing. Each one is a full release build,
  # so they run on a Release PR and on a manual run only.
  build-gate:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          RUN: >-
            ${{
              github.repository == 'team-reflect/reflect-open' &&
              (github.event_name == 'workflow_dispatch' ||
                (github.event_name == 'pull_request' &&
                  startsWith(github.head_ref, 'release-please') &&
                  github.event.pull_request.head.repo.full_name == github.repository))
            }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"

  build-macos-desktop:
    needs: build-gate
    if: needs.build-gate.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build-macos-desktop

      - name: Build
        run: pnpm release:macos --no-sign

  build-ios-mobile:
    needs: build-gate
    if: needs.build-gate.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios
          cache-key: build-ios-mobile

      - name: Build
        run: pnpm release:ios --build-number="$(date -u +%Y%m%d%H%M)" --no-sign

  build-windows-desktop:
    needs: build-gate
    if: needs.build-gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build-windows-desktop

      # Without the updater key, the script writes no updater signature.
      - name: Build
        shell: bash
        run: pnpm release:windows

  # A single job for branch protection to require, instead of listing every
  # job (and every matrix entry) as a required status check. The `build-*`
  # jobs are not listed: they are skipped on most pull requests.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [node-lint, node-test, rust-lint, rust-test]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && github.event_name != 'merge_group') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
