name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test-chromium:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    env:
      REFLECT_TEST_BROWSER: chromium
      # Chromium on Linux does not promptly free the iframe of a finished
      # test file (https://issues.chromium.org/issues/530892387), so one
      # browser process grows by 10 to 30 MB per file and dies near 2.5 GB,
      # which Vitest reports as "Browser connection was closed". Vitest can
      # collect garbage after each file, but only when the temp disk has
      # less free space than this threshold; an unreachable threshold makes
      # it collect every time (about 60 ms per file).
      # Vitest reads this variable: https://github.com/vitest-dev/vitest/blob/v5.0.4/packages/vitest/src/node/pools/browser.ts#L773
      VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '100000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop test:install:chromium

      - name: Test
        run: pnpm run test

  # Not part of `all-green`: a WebKit failure does not block merging.
  test-webkit:
    if: github.event_name != 'merge_group'
    runs-on: macos-26
    # DEBUG ONLY: page crash rate of WebKit 2359, and of 2370 without the JIT.
    strategy:
      fail-fast: false
      matrix:
        webkit: ['2359', '2370-jit-off']
        repeat: [1, 2, 3, 4, 5]
    env:
      REFLECT_TEST_BROWSER: webkit
      # Suspected workaround, root cause unknown: WebContent sometimes
      # segfaults in JavaScriptCore JIT code ("The webkit page crashed") in
      # Playwright WebKit builds 2359, 2370 and 2378. Full browser test runs
      # crashed about 1 in 8 times with the JIT and 0 in 15 without it. The
      # `__XPC_` prefix passes the variable to the WebContent XPC service.
      __XPC_JSC_useJIT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop test:install:webkit

      # DEBUG ONLY: Playwright 1.64.1 runs whatever build is in webkit-2370.
      - name: Turn off the JSC JIT
        if: matrix.webkit == '2370-jit-off'
        run: echo '__XPC_JSC_useJIT=0' >> "$GITHUB_ENV"

      - name: Use WebKit ${{ matrix.webkit }}
        if: matrix.webkit == '2359'
        run: |
          dir=~/Library/Caches/ms-playwright/webkit-2370
          curl -sfL -o "$RUNNER_TEMP/webkit.zip" \
            "https://cdn.playwright.dev/dbazure/download/playwright/builds/webkit/${{ matrix.webkit }}/webkit-mac-26-arm64.zip"
          rm -rf "$dir"
          mkdir -p "$dir"
          unzip -q "$RUNNER_TEMP/webkit.zip" -d "$dir"
          touch "$dir/INSTALLATION_COMPLETE" "$dir/DEPENDENCIES_VALIDATED"

      - name: Show the WebKit version
        run: plutil -p ~/Library/Caches/ms-playwright/webkit-2370/JavaScriptCore.framework/Versions/A/Resources/Info.plist | grep CFBundleVersion

      - name: Start the memory sampler
        run: |
          dir="$RUNNER_TEMP/webkit-diagnostics"
          mkdir -p "$dir"
          touch "$dir/started"
          nohup .github/scripts/sample-webkit-memory.sh > "$dir/memory.log" 2>&1 < /dev/null &

      # DEBUG ONLY: run the browser tests 3 times and count page crashes.
      - name: Test browser (3 rounds)
        run: |
          dir="$RUNNER_TEMP/webkit-diagnostics"
          crashes=0
          for round in 1 2 3; do
            for shard in 1 2 3; do
              log="$dir/round-$round-shard-$shard.log"
              pnpm run test run --project '*browser*' --shard="$shard/3" --reporter=verbose > "$log" 2>&1 || true
              echo "round $round shard $shard: $(grep -E '^ +Tests ' "$log" | tail -1)"
              if grep -q VITEST_BROWSER_CONNECTION_CLOSED "$log"; then
                crashes=$((crashes + 1))
                echo "::warning::WebKit ${{ matrix.webkit }} page crash in round $round shard $shard"
              fi
            done
          done
          echo "$crashes" > "$dir/crashes.txt"
          echo "crashes: $crashes"
          [ "$crashes" = 0 ]

      # The termination reason of each WebKit content process, memory kill and
      # jetsam messages, and any crash report written during the job.
      # "thresold" is the spelling in WebKit's log message.
      - name: Collect WebKit diagnostics
        if: ${{ !cancelled() }}
        run: |
          dir="$RUNNER_TEMP/webkit-diagnostics"
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
            -type f -newer "$dir/started" -exec cp {} "$dir/" \; || true
          log show --style compact \
            --start "$(date -r "$dir/started" '+%Y-%m-%d %H:%M:%S')" \
            --predicate '(process == "Playwright" AND category == "Process")
              OR eventMessage CONTAINS "kill thresold"
              OR eventMessage CONTAINS[c] "jetsam"' \
            > "$dir/system.log" || true

      - name: Upload WebKit diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-${{ matrix.webkit }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/webkit-diagnostics/
          retention-days: 14

  lint-rust:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Test
        run: cargo test --workspace

  # A single job for branch protection to require, instead of listing every
  # job as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [lint-node, test-chromium, lint-rust, test-rust]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && github.event_name != 'merge_group') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
