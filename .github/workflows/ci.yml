name: CI

on:
  push:
    # master is the only long-lived branch.
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  node:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
        config:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit

    name: test ${{ matrix.config.browser }} ${{ matrix.shard }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install ${{ matrix.config.browser }}

      - name: Test
        run: pnpm run test --shard ${{ matrix.shard }}
        env:
          REFLECT_TEST_BROWSER: ${{ matrix.config.browser }}

  rust:
    name: fmt · clippy · test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri v2 build dependencies (the crate links the WebView + GTK stack).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed clippy/test run still compiled the dependency tree; save it
          # so the next push doesn't pay the cold-build cost again.
          cache-on-failure: true

      # ort-sys (fastembed → ort) downloads prebuilt ONNX Runtime binaries at
      # build time and extracts them to ~/.cache/ort.pyke.io — outside target/,
      # so rust-cache never captures them and every run re-downloads. The build
      # script skips the download when the extracted dir is already present.
      # Entries are content-addressed (dfbin/<target>/<hash>), so restoring a
      # stale cache after an ort upgrade is safe — it just downloads anew.
      - name: Cache ONNX Runtime binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ort-bin-${{ runner.os }}-

      # Without this, actions/cache warns at save time on builds that never
      # trigger the ort download (the path wouldn't exist).
      - name: Ensure ort cache dir exists
        run: mkdir -p ~/.cache/ort.pyke.io

      # tauri-build requires the sidecar to exist before the desktop crate's
      # build script runs (clippy/test compile it), so stage the CLI first.
      - name: Stage the reflect CLI sidecar
        run: node apps/desktop/scripts/build-sidecar.mjs

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  apple-rust:
    name: check Apple Rust bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.mjs

      - name: Check desktop library
        run: cargo check -p reflect-open --lib

      # The TestFlight workflow is the only full iOS build and it never runs on
      # pull requests, so type-check the iOS target here with the same feature
      # set `tauri ios` builds with.
      - name: Check iOS library
        run: cargo check -p reflect-open --lib --target aarch64-apple-ios --no-default-features

  # A single job for branch protection to require, instead of listing every
  # job (and every matrix shard) as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [node, test, rust, apple-rust]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
