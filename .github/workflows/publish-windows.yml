name: Windows

# Experimental: builds Windows x64 and arm64 NSIS installers that are not
# code-signed. A release build also uploads them, with their updater
# signatures, into the draft release. See docs/windows-builds.md.

on:
  # Builds the installers as workflow artifacts only.
  workflow_dispatch:
  # Validate changes to the Windows build itself before merging; regular PRs
  # never trigger this.
  pull_request:
    paths:
      - .github/workflows/publish-windows.yml
      - .github/actions/setup-node/action.yml
      - .github/actions/setup-rust/action.yml
      - apps/desktop/scripts/release-windows.ts
      - apps/desktop/scripts/helpers.ts
  # Called by release.yml so every release also produces a Windows build.
  workflow_call:
    inputs:
      tag:
        description: The release tag (v<version>) created by release-please
        required: true
        type: string
      commit:
        description: Immutable commit targeted by the release tag.
        required: true
        type: string

# A release build uploads its assets into the draft release.
# publish-finalize.yml writes latest.json and publishes the release afterwards.
permissions:
  contents: write

jobs:
  windows:
    name: Build Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each runner's host triple is the build target, so no extra rustup
        # target and no cross-compilation.
        include:
          - name: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.target }}

      # The updater key signs the installer for the in-app updater (minisign);
      # it is not a code-signing certificate. Without the key (a PR from a
      # fork) the build writes no signature. No Sentry secrets on purpose:
      # without SENTRY_AUTH_TOKEN the Sentry vite plugin skips source-map
      # upload, and without VITE_SENTRY_DSN the experimental build carries no
      # telemetry.
      - name: Build Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm release:windows --target=${{ matrix.target }} --artifact-dir="$RUNNER_TEMP/windows-artifacts"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflect-windows-${{ matrix.name }}
          path: ${{ runner.temp }}/windows-artifacts/*
          if-no-files-found: error
          # The NSIS installer is already lzma-compressed; zipping it again
          # wastes minutes for nothing.
          compression-level: 0
          retention-days: 90

      # Uploads clobber, so a failed run can be retried.
      - name: Upload the assets to the draft release
        if: inputs.tag != ''
        shell: bash
        working-directory: ${{ runner.temp }}/windows-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ./* --clobber
