# https://autofix.ci/setup

name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD is the PR merge commit, and HEAD^1 is the base branch.
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- \
              '*.rs' \
              rust-toolchain.toml; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

          if ! git diff --quiet HEAD^1 HEAD -- \
              pnpm-lock.yaml \
              Cargo.lock; then
            echo "licenses=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-node

      # `cargo about` in `gen:licenses` also needs the toolchain.
      - name: Install Rust toolchain
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.licenses == 'true'
        run: rustup toolchain install --no-self-update

      - name: Fix (TypeScript)
        run: pnpm run fix

      - name: Fix (Rust)
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all

      - name: Fix (Swift)
        run: |
          swift format --version
          git ls-files -z '*.swift' | xargs -0 swift format format --parallel --in-place

      - name: Install cargo-about
        if: steps.changes.outputs.licenses == 'true'
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-about@0.9.2

      - name: Generate licenses
        if: steps.changes.outputs.licenses == 'true'
        run: pnpm gen:licenses

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
