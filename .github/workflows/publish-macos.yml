name: Release App

on:
  # The normal path: called by release.yml right after release-please creates
  # the draft release for a merged Release PR.
  workflow_call:
    inputs:
      tag:
        description: The release tag (v<version>) created by release-please
        type: string
        required: true
      commit:
        description: Immutable commit targeted by the release tag
        type: string
        required: true
  # Manual retry path: run on the release commit. The tag is derived from
  # apps/desktop/package.json, and its draft release must already exist.
  workflow_dispatch:

# Never run two builds of a release at once, and never cancel one
# mid-notarization — queue instead.
concurrency:
  group: publish-macos
  cancel-in-progress: false

# The build uploads its assets into the draft release. publish-finalize.yml
# writes latest.json and publishes the release afterwards.
permissions:
  contents: write

jobs:
  macos:
    if: github.repository == 'team-reflect/reflect-open'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Cargo registry fetches can intermittently fail on GitHub macOS runners
      # with curl HTTP/2 framing errors. HTTP/1.1 is slower but steadier for
      # release builds, where determinism matters more than a small fetch win.
      CARGO_HTTP_MULTIPLEXING: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin
          - name: Intel
            runner: macos-26
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reusable workflows inherit the caller SHA, which may be newer or
          # older than the release. Build the verified immutable tag commit.
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      # The release is tagged v<version> from apps/desktop/package.json (the
      # single version source; tauri.conf.json points at it). When called from
      # release.yml, the tag it created must match the checked-out
      # commit's version, or the assets would publish under the wrong name.
      - name: Verify the release tag matches apps/desktop/package.json
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(jq -r .version apps/desktop/package.json)"
          tag="${INPUT_TAG:-v${version}}"
          if [ "$tag" != "v${version}" ]; then
            echo "::error::release tag ${tag} but apps/desktop/package.json says ${version} — run this workflow on the release commit"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # Without the certificate, signing only fails at codesign time — after
      # the whole Rust build. Check every required secret up front instead.
      # docs/macos-distribution.md describes how to produce each one.
      - name: Verify release secrets are configured
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD SENTRY_AUTH_TOKEN SENTRY_DSN TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if { [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; } &&
            { [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; }; then
            missing+=("APPLE_API_KEY+APPLE_API_ISSUER+APPLE_API_KEY_CONTENT (or APPLE_ID+APPLE_PASSWORD)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing release secret(s): ${missing[*]} — see docs/macos-distribution.md"
            exit 1
          fi

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.runner }}-${{ matrix.target }}

      # Tauri signs the .app; the script then repairs sidecar signatures,
      # notarizes + staples the app and DMG, signs the updater archive, and
      # runs the Gatekeeper checks.
      - name: Build, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: pnpm release:macos --target=${{ matrix.target }} --artifact-dir="$RUNNER_TEMP/release-artifacts"

      # Uploads clobber, so a failed run can be retried.
      - name: Upload the assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/release-artifacts"/* --clobber
