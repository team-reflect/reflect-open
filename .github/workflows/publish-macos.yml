name: Publish macOS

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (v<version>) created by release-please
        type: string
        required: true
      commit:
        description: Immutable commit targeted by the release tag
        type: string
        required: true
    secrets:
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY_CONTENT:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_DSN:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true

concurrency:
  group: publish-macos
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: Build macOS ${{ matrix.name }}
    if: github.repository == 'team-reflect/reflect-open'
    environment: release_app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: universal
            runner: macos-26
            target: universal-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reusable workflows inherit the caller SHA, which may be newer or
          # older than the release. Build the verified immutable tag commit.
          ref: ${{ inputs.commit }}
          persist-credentials: false

      # Without the certificate, signing only fails at codesign time — after
      # the whole Rust build. Check every required secret up front instead.
      # docs/macos-distribution.md describes how to produce each one.
      - name: Verify release secrets are configured
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT SENTRY_AUTH_TOKEN SENTRY_DSN TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing release secret(s): ${missing[*]} — see docs/macos-distribution.md"
            exit 1
          fi

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.target }}

      # The universal build also compiles the x86_64 slice on this arm64 runner.
      - name: Add the x86_64 macOS target
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      # Tauri signs the .app; the script then repairs sidecar signatures,
      # notarizes + staples the app and DMG, signs the updater archive, and
      # runs the Gatekeeper checks.
      - name: Build, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: pnpm build:macos --target=${{ matrix.target }} --artifact-dir="$RUNNER_TEMP/macos-artifacts"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reflect-macos-${{ matrix.name }}
          path: ${{ runner.temp }}/macos-artifacts/*
          if-no-files-found: error
          # The DMG and the updater archive are already compressed; zipping
          # them again wastes minutes for nothing.
          compression-level: 0
          # The dSYMs symbolicate crash reports. 90 days is the most a public
          # repository allows; the release keeps another copy.
          retention-days: 90

      # Uploads clobber, so a failed run can be retried.
      - name: Upload the assets to the draft release
        working-directory: ${{ runner.temp }}/macos-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ./* --clobber
