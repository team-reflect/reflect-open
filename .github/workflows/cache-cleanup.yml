name: Cache cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: ci-refs/pull/${{ github.event.pull_request.number }}/merge
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    name: Delete PR caches
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - run: |
          gh cache list --ref "refs/pull/$PR_NUMBER/merge" --sort size_in_bytes --limit 100 --json key,id --jq '.[] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "Deleting $key"
              gh cache delete "$id" || true
              sleep 1
            done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
