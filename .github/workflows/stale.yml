name: Stale

# Closes issues and PRs that a maintainer labeled `likely resolved` once they
# go quiet. Only people add or remove `likely resolved`; this workflow only
# manages the `Stale` label. Any comment or update removes `Stale` and
# restarts the clock.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would happen
        type: boolean
        default: true

permissions: {}

concurrency:
  group: stale

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-24.04
    permissions:
      actions: write # cache the processing state between runs
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-labels: 'likely resolved'
          days-before-stale: 1
          days-before-close: 7
          stale-issue-message: This looks fixed. We will close it in 7 days unless someone comments.
          stale-pr-message: This looks resolved. We will close it in 7 days unless someone comments.
          close-issue-reason: completed
          close-issue-message: Closing due to no activity. Comment here if you still see the problem.
          close-pr-message: Closing due to no activity.
          debug-only: ${{ inputs.dry-run == true }}
