name: Release Browser Extension

on:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit targeted by the release tag
        type: string
        required: true

concurrency:
  group: release-browser-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'team-reflect/reflect-open' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Build the store package
        run: pnpm --filter @reflect/extension zip

      - name: Submit to Chrome
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ccabifmooehighoonjeiololjfofkhkd
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # DEFAULT_PUBLISH or STAGED_PUBLISH
          CHROME_PUBLISH_TYPE: STAGED_PUBLISH
        run: pnpm exec wxt submit --chrome-zip .output/reflect-capture-*-chrome.zip
