name: Release Browser Extension

on:
  workflow_call:
    inputs:
      tag:
        description: The extension-v<version> tag created by release-please
        type: string
        required: true
      commit:
        description: Immutable commit targeted by the release tag
        type: string
        required: true

concurrency:
  group: release-browser-extension
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'team-reflect/reflect-open' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the store package
        run: pnpm --filter @reflect/extension zip

      - name: Archive the store package
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" apps/extension/.output/reflect-capture-*-chrome.zip --clobber
        # FIXME: we do not need to create github release. so remove your "gh release upload" and "gh release edit"

      - name: Submit to Chrome
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ccabifmooehighoonjeiololjfofkhkd
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
        run: pnpm exec wxt submit --chrome-zip .output/reflect-capture-*-chrome.zip

      - name: Publish the extension release assets
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest=false
