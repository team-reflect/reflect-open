name: Release Browser Extension

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (extension-v<version>) created by release-please
        type: string
        required: true
      commit:
        description: Immutable commit targeted by the release tag
        type: string
        required: true
    secrets:
      CHROME_PUBLISHER_ID:
        required: true
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
        required: true
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
        required: true

concurrency:
  group: release-browser-extension
  cancel-in-progress: false

# Uploads the zip into the release-please draft release and undrafts it.
permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'team-reflect/reflect-open' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify the release tag matches apps/extension/package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(jq -r .version apps/extension/package.json)"
          if [ "$TAG" != "extension-v${version}" ]; then
            echo "::error::release tag ${TAG} but apps/extension/package.json says ${version}"
            exit 1
          fi
          echo "EXTENSION_VERSION=${version}" >> "$GITHUB_ENV"

      # Store package first, keyed package second, so .output/chrome-mv3 ends
      # up keyed (the same state a local `pnpm build` leaves behind).
      - name: Build the store package
        run: pnpm --filter @reflect/extension zip

      - name: Build the unpacked package
        run: pnpm --filter @reflect/extension zip:unpacked

      # The GitHub release is the fallback while store review runs (or fails),
      # so it is filled and published before the store submission.
      - name: Attach the unpacked package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" --clobber \
            "apps/extension/.output/reflect-capture-${EXTENSION_VERSION}-chrome-unpacked.zip"

      - name: Append the install instructions and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          if ! grep -q '^## Install before it reaches' release-notes.md; then
            cat >> release-notes.md <<EOF

          ## Install before it reaches the Chrome Web Store

          1. Download \`reflect-capture-${EXTENSION_VERSION}-chrome-unpacked.zip\` below and unzip it. Keep the folder: Chrome loads the extension from it.
          2. Open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and pick the unzipped folder.
          3. If the Chrome Web Store copy of Reflect Capture is also installed, turn it off.

          When the Web Store has ${EXTENSION_VERSION}, remove this copy and turn the store copy back on.
          EOF
          fi
          # --latest=false is load-bearing: releases/latest/download/latest.json
          # is the stable desktop updater feed.
          gh release edit "$TAG" \
            --notes-file release-notes.md \
            --draft=false \
            --latest=false

      - name: Submit to Chrome
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ccabifmooehighoonjeiololjfofkhkd
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # DEFAULT_PUBLISH or STAGED_PUBLISH
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_CANCEL_PENDING: true
        run: pnpm exec wxt submit --chrome-zip ".output/reflect-capture-${EXTENSION_VERSION}-chrome.zip"
