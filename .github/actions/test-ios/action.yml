name: Test the iOS app
description: Builds the Swift shell in apps/ios and runs one test plan in a new simulator.

inputs:
  plan:
    description: Test plan of the Reflect scheme, `Reflect` or `Nightly`.
    required: false
    default: Reflect

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-xcode

    - uses: ./.github/actions/setup-node

    - uses: ./.github/actions/setup-rust
      with:
        cache-key: test-ios

    - uses: ./.github/actions/setup-mise

    # The steps are separate so that the job page shows the time of each.
    - name: Build the web app
      shell: bash
      run: pnpm --filter @reflect/ios build:web

    - name: Build the Rust core
      shell: bash
      run: pnpm build:ffi --debug --sdk iphonesimulator

    - name: Resolve the Swift packages
      shell: bash
      run: |
        xcodebuild -resolvePackageDependencies \
          -project apps/ios/Reflect.xcodeproj \
          -scheme Reflect \
          -derivedDataPath "$RUNNER_TEMP/DerivedData"

    # The job summary shows the time of each step of the script.
    - name: Build and run the tests
      shell: bash
      env:
        PLAN: ${{ inputs.plan }}
      run: |
        pnpm test:ios \
          --plan "$PLAN" \
          --skip-web \
          --derived-data "$RUNNER_TEMP/DerivedData" \
          --output "$RUNNER_TEMP/test-ios"

    # The result bundle has the screenshots and the steps of each failed test.
    - name: Upload the result bundle and the logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-ios-${{ inputs.plan }}
        path: ${{ runner.temp }}/test-ios
        retention-days: 7
