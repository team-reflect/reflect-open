name: Set up Xcode
description: Select a fixed Xcode and fail when the image does not have it.
inputs:
  version:
    description: Xcode version, e.g. 27.1
    required: false
    default: '27.1'
runs:
  using: composite
  steps:
    - name: Check that Xcode ${{ inputs.version }} is installed
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.version }}
      run: |
        app="/Applications/Xcode_${XCODE_VERSION}.app"
        if [ ! -d "$app" ]; then
          echo "::error::$app is not on this image"
          ls -d /Applications/Xcode*.app
          exit 1
        fi

    - name: Select Xcode ${{ inputs.version }}
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.version }}
      run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

    - name: Print the Xcode version
      shell: bash
      run: xcodebuild -version

    - name: Print the iOS SDK version
      shell: bash
      run: xcrun --sdk iphoneos --show-sdk-version
