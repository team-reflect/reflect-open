# Run before setup-rust, which keys its cache on `xcrun clang`.
name: Set up Xcode
description: Select a fixed Xcode version
inputs:
  version:
    description: Xcode version
    required: false
    default: '27.1'
runs:
  using: composite
  steps:
    - name: List installed Xcode versions
      shell: bash
      run: |
        for app in /Applications/Xcode*.app; do
          echo "======="
          echo "Xcode path: $app"
          echo "Xcode real path: $(realpath "$app")"
          echo "Xcode version: $(plutil -extract CFBundleShortVersionString raw "$app/Contents/version.plist")"
          echo "Xcode build number: $(plutil -extract ProductBuildVersion raw "$app/Contents/version.plist")"
        done

    - name: Print the Xcode version before
      shell: bash
      run: xcodebuild -version

    - name: Select Xcode ${{ inputs.version }}
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.version }}
      run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

    - name: Print the Xcode version after
      shell: bash
      run: xcodebuild -version
