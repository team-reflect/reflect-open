name: Set up Rust
description: Installs mise, the tools in `mise.toml` (Rust and mbx included), and the mbx build cache.

inputs:
  cache:
    description: Whether to restore and save the caches.
    required: false
    default: 'true'
  cache-scope:
    description: The name of the mbx cache that this job restores and saves.
    required: false
    default: ${{ github.workflow }}-${{ github.job }}
  cache-links:
    description: Whether mbx caches native links. `auto` caches them on Linux.
    required: false
    default: auto
  s3-endpoint:
    description: S3 endpoint of the build cache bucket.
    required: false
    default: ''
  s3-bucket:
    description: Name of the build cache bucket.
    required: false
    default: ''
  s3-access-key-id:
    description: Access key ID for the build cache bucket.
    required: false
    default: ''
  s3-secret-access-key:
    description: Secret access key for the build cache bucket.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure cargo
      shell: bash
      run: |
        echo "CARGO_PROFILE_DEV_DEBUG=false" >> "$GITHUB_ENV"

    - name: Configure cache compression
      shell: bash
      run: |
        # actions/cache runs zstd without a level, so zstd reads ZSTD_CLEVEL.
        # https://github.com/actions/toolkit/blob/0c3a9c332b678ff1e776f93d728a4ad279803abe/packages/cache/src/internal/tar.ts#L239
        echo "ZSTD_CLEVEL=10" >> "$GITHUB_ENV"

    # Installs the Rust toolchain through rustup, mbx and the other tools, and
    # puts mise's `cargo` wrapper first on PATH, so `cargo` runs through mbx.
    - name: Install mise and tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.12
        cache: ${{ inputs.cache }}

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    - name: Print cargo path
      shell: bash
      run: command -v cargo

    # `ort-sys` downloads prebuilt ONNX Runtime binaries into ORT_CACHE_DIR.
    # ORT_CACHE_DIR is documented in the v2.0.0-rc.11 release notes:
    # https://github.com/pykeio/ort/releases/tag/v2.0.0-rc.11
    - name: Set the ONNX Runtime cache dir
      shell: bash
      run: echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort_cache" >> "$GITHUB_ENV"

    - name: Cache ONNX Runtime
      id: ort
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ORT_CACHE_DIR }}
        key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

    # The ort-sys build script downloads ONNX Runtime only when it runs, and
    # mbx replays a cached build-script run instead of running it.
    # https://github.com/jdx/mr-boxington/blob/v1.30.0/docs/limits.md#build-script-execution-follows-cargos-freshness-inputs
    # Remove this step once https://github.com/pykeio/ort/issues/676 is fixed.
    - name: Run build scripts without the mbx cache
      if: inputs.cache == 'true' && steps.ort.outputs.cache-hit != 'true'
      shell: bash
      run: echo "MBX_BUILD_SCRIPT_EXECUTION=0" >> "$GITHUB_ENV"

    # https://github.com/jdx/mr-boxington/blob/v1.30.0/docs/remote-cache.md#cloudflare-r2-and-minio
    - name: Pick the mbx backend
      id: mbx
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
      run: |
        if [ "$CACHE" != 'true' ]; then
          backend=local
        elif [ -n "$S3_ENDPOINT" ] && [ -n "$S3_BUCKET" ] && [ -n "$S3_ACCESS_KEY_ID" ] && [ -n "$S3_SECRET_ACCESS_KEY" ]; then
          backend=remote
          {
            echo "MBX_REMOTE_URL=s3://$S3_BUCKET/mbx"
            echo "MBX_REMOTE_NAMESPACE=reflect-open"
            echo "MBX_REMOTE_S3_ENDPOINT=$S3_ENDPOINT"
            echo "MBX_REMOTE_S3_REGION=auto"
            echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY"
          } >> "$GITHUB_ENV"
        else
          backend=github
        fi
        echo "backend=$backend" >> "$GITHUB_OUTPUT"

    # Uses the mbx that mise installed. A push to master or a workflow_dispatch
    # saves the cache. https://mr-boxington.jdx.dev/github-action
    - name: Set up mbx
      uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
      with:
        backend: ${{ steps.mbx.outputs.backend }}
        cache-links: ${{ inputs.cache-links }}
        github-cache-mode: objects
        cache-key: |
          mbx-v2/${{ runner.os }}/${{ runner.arch }}/${{ inputs.cache-scope }}/${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          mbx-v2/${{ runner.os }}/${{ runner.arch }}/${{ inputs.cache-scope }}/
        save-on-workflow-dispatch: true

    # The ort-sys build script declares no input for the downloaded binaries,
    # so Cargo reuses its output from the restored target directory.
    # Removing its build directories makes Cargo run it again.
    # Remove this step once https://github.com/pykeio/ort/issues/676 is fixed.
    - name: Run the ort-sys build script again
      if: inputs.cache == 'true' && steps.ort.outputs.cache-hit != 'true'
      shell: bash
      run: |
        shopt -s nullglob
        dirs=(target/*/build/ort-sys target/*/*/build/ort-sys)
        echo "Removing: ${dirs[*]:-nothing}"
        rm -rf "${dirs[@]}"
