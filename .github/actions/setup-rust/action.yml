name: Set up Rust
description: Installs the Rust toolchain and the cargo build cache.

inputs:
  cache:
    description: Whether to restore and save the cache.
    required: false
    default: 'true'
  cache-targets:
    description: Whether to cache the target directory.
    required: false
    default: 'false'
  s3-endpoint:
    description: S3 endpoint of the sccache bucket.
    required: false
    default: ''
  s3-bucket:
    description: Name of the sccache bucket.
    required: false
    default: ''
  s3-access-key-id:
    description: Access key ID for the sccache bucket.
    required: false
    default: ''
  s3-secret-access-key:
    description: Secret access key for the sccache bucket.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure cargo
      shell: bash
      run: |
        echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    # ort-sys downloads prebuilt ONNX Runtime binaries into ORT_CACHE_DIR.
    # Caching it skips the download.
    # ORT_CACHE_DIR is documented in the v2.0.0-rc.11 release notes:
    # https://github.com/pykeio/ort/releases/tag/v2.0.0-rc.11
    - name: Set the ONNX Runtime cache dir
      shell: bash
      run: echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort_cache" >> "$GITHUB_ENV"

    # Skip sccache on Windows because of error "The filename or extension is too long" (os error 206). See https://github.com/mozilla/sccache/issues/2397
    - name: Install sccache
      if: inputs.cache == 'true' && runner.os != 'Windows'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Enable sccache
      if: inputs.cache == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

        # Look up the local disk first, then the GitHub Actions cache, then S3.
        # https://github.com/mozilla/sccache/blob/v0.19.0/docs/MultiLevel.md
        # https://github.com/mozilla/sccache/blob/v0.19.0/docs/S3.md
        echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
        if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_BUCKET" ] && [ -n "$S3_ACCESS_KEY_ID" ] && [ -n "$S3_SECRET_ACCESS_KEY" ]; then
          echo "SCCACHE_MULTILEVEL_CHAIN=disk,gha,s3" >> "$GITHUB_ENV"
          echo "SCCACHE_ENDPOINT=$S3_ENDPOINT" >> "$GITHUB_ENV"
          echo "SCCACHE_BUCKET=$S3_BUCKET" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=sccache/" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
        else
          echo "No S3 secrets: sccache uses the disk and the GitHub Actions cache only."
          echo "SCCACHE_MULTILEVEL_CHAIN=disk,gha" >> "$GITHUB_ENV"
        fi

        # Without this, sccache writes a probe file before every write, and a
        # rate-limited probe makes it skip the write.
        echo "SCCACHE_SKIP_CACHE_CHECK=true" >> "$GITHUB_ENV"

        # Upload to the remote caches only on master.
        if [ "$GITHUB_REF" != "refs/heads/master" ]; then
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
        fi

    - name: Cache cargo registry
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-targets: ${{ inputs.cache-targets }}
        cache-directories: ${{ env.ORT_CACHE_DIR }}
        save-if: ${{ github.ref == 'refs/heads/master' }}
