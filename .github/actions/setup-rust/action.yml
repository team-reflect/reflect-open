name: Set up Rust
description: Installs the Rust toolchain and the cargo build cache.

inputs:
  cache:
    description: Whether to restore and save the cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Cargo registry fetches can intermittently fail on GitHub runners with
    # curl HTTP/2 framing errors. HTTP/1.1 is slower but steadier.
    - name: Disable HTTP/2 multiplexing in cargo
      shell: bash
      run: echo "CARGO_HTTP_MULTIPLEXING=false" >> "$GITHUB_ENV"

    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    # ort-sys downloads prebuilt ONNX Runtime binaries into ORT_CACHE_DIR.
    # Caching it skips the download.
    # ORT_CACHE_DIR is documented in the v2.0.0-rc.11 release notes:
    # https://github.com/pykeio/ort/releases/tag/v2.0.0-rc.11
    - name: Set the ONNX Runtime cache dir
      shell: bash
      run: echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort_cache" >> "$GITHUB_ENV"

    - name: Install sccache
      if: inputs.cache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Enable sccache
      if: inputs.cache == 'true'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        # Look up the local disk first, then the GitHub Actions cache. A GHA
        # hit is copied to the disk, and a write goes to both levels.
        # https://github.com/mozilla/sccache/blob/v0.19.0/docs/MultiLevel.md
        echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_MULTILEVEL_CHAIN=disk,gha" >> "$GITHUB_ENV"
        # Write every level before the compile returns, so that no write is
        # still running in the background when the job ends.
        echo "SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=all" >> "$GITHUB_ENV"
        # Without this, sccache writes a probe file to GHA before every write,
        # and a rate-limited probe makes it skip the write.
        echo "SCCACHE_SKIP_CACHE_CHECK=true" >> "$GITHUB_ENV"

    - name: Cache cargo registry
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-targets: false
        cache-directories: ${{ env.ORT_CACHE_DIR }}

    # Fails if Cargo.lock is out of date.
    - name: Check Cargo.lock
      shell: bash
      run: cargo update --workspace --locked
