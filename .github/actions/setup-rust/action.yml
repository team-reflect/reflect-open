name: Set up Rust
description: Installs the Rust toolchain, the cargo build cache, and on Linux the Tauri system dependencies.

inputs:
  cache:
    description: Whether to restore and save the cargo build cache.
    required: false
    default: 'true'
  cache-key:
    description: An extra key for the cargo build cache, for jobs that must not share one.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Cargo registry fetches can intermittently fail on GitHub runners with
    # curl HTTP/2 framing errors. HTTP/1.1 is slower but steadier.
    - name: Disable HTTP/2 multiplexing in cargo
      shell: bash
      run: echo "CARGO_HTTP_MULTIPLEXING=false" >> "$GITHUB_ENV"

    # Tauri v2 build dependencies (the crate links the WebView + GTK stack).
    # The list is the one in the Tauri docs, minus `patchelf`, which the runner
    # image already has:
    # https://github.com/tauri-apps/tauri-docs/blob/5e49cc6e48597060f1618e0b62cb91b071b1b4a9/src/content/docs/distribute/Pipelines/github.mdx?plain=1#L105
    # `libayatana-appindicator3-dev` replaces the deprecated
    # `libappindicator3-dev`, as in the Tauri prerequisites page.
    #
    # The `.deb` files are cached per runner image. `ImageOS` and
    # `ImageVersion` are runner environment variables, which the `env` context
    # does not have.
    - name: Compute the apt cache key
      id: apt
      if: runner.os == 'Linux'
      shell: bash
      run: echo "key=apt-$ImageOS-$ImageVersion-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"

    - name: Restore the apt package cache
      id: apt-cache
      if: runner.os == 'Linux' && inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives/*.deb
        key: ${{ steps.apt.outputs.key }}

    # The image's package index can name versions the archive has since
    # removed, so update first. Only the download runs under `timeout`, since
    # killing `dpkg` mid-install would break the retry.
    - name: Install Tauri system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        packages="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils"
        archives="$RUNNER_TEMP/apt-archives"
        opts="--yes --no-install-recommends -o Dir::Cache::Archives=$archives"
        mkdir -p "$archives"
        if ! sudo timeout 120 apt-get update || ! sudo timeout 180 apt-get install $opts --download-only $packages; then
          # The Azure mirror can trickle at ~50 kB/s without tripping apt's failover: https://github.com/actions/runner-images/issues/14823
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo timeout 120 apt-get update
          sudo apt-get install $opts --download-only $packages
        fi
        sudo apt-get install $opts $packages

    # The glob skips the `lock` file and `partial/` directory that apt keeps
    # there, which only root and `_apt` can read.
    - name: Save the apt package cache
      if: runner.os == 'Linux' && inputs.cache == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    # Build scripts (ort-sys, swift-rs) write the path of Xcode's clang runtime
    # into their cached output, and cargo does not rerun them when Xcode
    # changes. rust-cache hashes RUST_* variables into its key, so a new Xcode
    # starts from a cold cache instead of failing at link time.
    - name: Scope the cargo cache to Xcode
      if: runner.os == 'macOS'
      shell: bash
      # Ensures the setup-xcode action has run before setup-rust, so that xcrun clang points to the selected Xcode version.
      run: echo "RUST_CACHE_CLANG_DIR=$(xcrun clang --print-resource-dir)" >> "$GITHUB_ENV"

    # ort-sys (fastembed → ort) downloads prebuilt ONNX Runtime binaries at
    # build time into $ORT_CACHE_DIR/dfbin/<target>/<hash> and writes that
    # absolute path into its build script output in target/. Cargo does not
    # rerun the build script when the directory is missing, so the binaries
    # must live in the same cache entry as target/, or a restored target/ fails
    # to link with "could not find native static library onnxruntime".
    # ORT_CACHE_DIR is documented in the v2.0.0-rc.11 release notes:
    # https://github.com/pykeio/ort/releases/tag/v2.0.0-rc.11
    - name: Set the ONNX Runtime cache dir
      shell: bash
      run: echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort_cache" >> "$GITHUB_ENV"

    # `env-vars` puts ORT_CACHE_DIR into the cache key, so changing the path
    # starts from a cold cache instead of a target/ that points to the old one.
    - name: Cache cargo build
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        env-vars: ORT_CACHE_DIR
        cache-directories: ${{ env.ORT_CACHE_DIR }}

    # Fails if Cargo.lock is out of date.
    - name: Check Cargo.lock
      shell: bash
      run: cargo update --workspace --locked
