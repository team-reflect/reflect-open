name: Set up Rust
description: Installs mise, the tools in `mise.toml` (Rust and mbx included), and the mbx build cache.

inputs:
  cache:
    description: Whether to restore and save the caches.
    required: false
    default: 'true'
  cache-scope:
    description: The job whose mbx cache this job restores and saves. Defaults to the current job.
    required: false
    default: ''
  cache-save:
    description: Whether to save the mbx cache. With 'false', the job only restores it.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure cargo
      shell: bash
      run: |
        echo "CARGO_PROFILE_DEV_DEBUG=false" >> "$GITHUB_ENV"

    - name: Configure cache compression
      shell: bash
      run: |
        # actions/cache runs zstd without a level, so zstd reads ZSTD_CLEVEL.
        # https://github.com/actions/toolkit/blob/0c3a9c332b678ff1e776f93d728a4ad279803abe/packages/cache/src/internal/tar.ts#L239
        echo "ZSTD_CLEVEL=10" >> "$GITHUB_ENV"

    # Installs the Rust toolchain through rustup, mbx and the other tools, and
    # puts mise's `cargo` wrapper first on PATH, so `cargo` runs through mbx.
    - name: Install mise and tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.12
        cache: ${{ inputs.cache }}

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    - name: Print cargo path
      shell: bash
      run: command -v cargo

    # `ort-sys` downloads prebuilt ONNX Runtime binaries into ORT_CACHE_DIR.
    # ORT_CACHE_DIR is documented in the v2.0.0-rc.11 release notes:
    # https://github.com/pykeio/ort/releases/tag/v2.0.0-rc.11
    - name: Set the ONNX Runtime cache dir
      shell: bash
      run: echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort_cache" >> "$GITHUB_ENV"

    - name: Cache ONNX Runtime
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ORT_CACHE_DIR }}
        key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

    - name: Compute the mbx cache key
      id: mbx-key
      shell: bash
      env:
        SCOPE: ${{ inputs.cache-scope || github.job }}
        TOOLCHAIN: ${{ hashFiles('rust-toolchain.toml') }}
      run: |
        prefix="mbx-objects-v1-$RUNNER_OS-$RUNNER_ARCH-$SCOPE-$TOOLCHAIN-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$GITHUB_SHA" >> "$GITHUB_OUTPUT"

    # Uses the mbx that mise installed. The `objects` mode restores and saves
    # the mbx object store; only a successful push to master saves.
    # https://mr-boxington.jdx.dev/github-action
    # The action skips the save when ACTIONS_CACHE_MODE does not permit writes.
    # https://github.com/jdx/mr-boxington-action/blob/b3ef673bd77c5426927fe8836c6185cdae04c2dd/src/lib.ts#L489-L505
    - name: Set up mbx
      uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
      env:
        ACTIONS_CACHE_MODE: ${{ inputs.cache-save == 'true' && 'write' || 'read' }}
      with:
        backend: ${{ inputs.cache == 'true' && 'github' || 'local' }}
        github-cache-mode: objects
        cache-key: ${{ steps.mbx-key.outputs.key }}
        restore-keys: ${{ steps.mbx-key.outputs.prefix }}
