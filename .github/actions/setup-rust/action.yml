name: Set up Rust
description: Installs the Rust toolchain and the cargo build cache.

inputs:
  cache:
    description: Whether to restore and save the cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure cargo
      shell: bash
      run: |
        echo "CARGO_PROFILE_DEV_DEBUG=false" >> "$GITHUB_ENV"

    - name: Configure cache compression
      shell: bash
      run: |
        # actions/cache runs zstd without a level, so zstd reads ZSTD_CLEVEL.
        # https://github.com/actions/toolkit/blob/0c3a9c332b678ff1e776f93d728a4ad279803abe/packages/cache/src/internal/tar.ts#L239
        echo "ZSTD_CLEVEL=10" >> "$GITHUB_ENV"

    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    # `ort-sys` downloads prebuilt ONNX Runtime binaries into ORT_CACHE_DIR.
    # ORT_CACHE_DIR is documented in the v2.0.0-rc.11 release notes:
    # https://github.com/pykeio/ort/releases/tag/v2.0.0-rc.11
    - name: Set the ONNX Runtime cache dir
      shell: bash
      run: echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort_cache" >> "$GITHUB_ENV"

    - name: Cache ONNX Runtime
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ORT_CACHE_DIR }}
        key: ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

    # kache caches the compiler outputs, so rust-cache keeps only the cargo
    # registry and git checkouts.
    - name: Cache cargo registry
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-targets: false
        save-if: ${{ github.ref == 'refs/heads/master' }}

    # https://github.com/kunobi-ninja/kache-action#readme
    - name: Set up kache
      if: inputs.cache == 'true'
      uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
      with:
        version: v2.3.0
        cache-key-prefix: kache-v0-${{ github.job }}
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        cache-executables: true
        pr-comment: false
