name: Set up Rust
description: Installs mise, the tools in `mise.toml` (Rust and mbx included), and the mbx build cache.

inputs:
  cache:
    description: Whether to restore and save the caches.
    required: false
    default: 'true'
  cache-scope:
    description: The name of the mbx cache that this job restores and saves.
    required: false
    default: ${{ github.workflow }}-${{ github.job }}
  cache-links:
    description: Whether mbx caches native links. `auto` caches them on Linux.
    required: false
    default: auto

runs:
  using: composite
  steps:
    - name: Configure cargo
      shell: bash
      run: |
        echo "CARGO_PROFILE_DEV_DEBUG=false" >> "$GITHUB_ENV"

    - name: Configure cache compression
      shell: bash
      run: |
        # actions/cache runs zstd without a level, so zstd reads ZSTD_CLEVEL.
        # https://github.com/actions/toolkit/blob/0c3a9c332b678ff1e776f93d728a4ad279803abe/packages/cache/src/internal/tar.ts#L239
        echo "ZSTD_CLEVEL=10" >> "$GITHUB_ENV"

    # Installs the Rust toolchain through rustup, mbx and the other tools, and
    # puts mise's `cargo` wrapper first on PATH, so `cargo` runs through mbx.
    - name: Install mise and tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.12
        cache: ${{ inputs.cache }}

    - name: Print rustc version
      shell: bash
      run: rustc --version --verbose

    - name: Print cargo path
      shell: bash
      run: command -v cargo

    # mbx replays a cached build-script run, OUT_DIR included. The OUT_DIR of
    # llama-cpp-sys-2 holds a CMake build directory with absolute paths, so a
    # replay in another checkout fails.
    # https://github.com/jdx/mr-boxington/blob/v1.30.0/docs/limits.md#build-script-execution-follows-cargos-freshness-inputs
    - name: Run build scripts without the mbx cache
      shell: bash
      run: echo "MBX_BUILD_SCRIPT_EXECUTION=0" >> "$GITHUB_ENV"

    # mbx moves OUT_DIR to a directory that the clippy and test target
    # directories share. The CMake cache of llama-cpp-sys-2 records one target
    # directory, so the second build fails. This keeps Cargo's own OUT_DIR.
    # https://github.com/jdx/mr-boxington/blob/v1.30.0/docs/limits.md#out-dir-sharing
    - name: Keep OUT_DIR in each target directory
      shell: bash
      run: echo "MBX_SHARE_OUT_DIR=0" >> "$GITHUB_ENV"

    # Uses the mbx that mise installed. A push to master or a workflow_dispatch
    # saves the cache. https://mr-boxington.jdx.dev/github-action
    - name: Set up mbx
      uses: jdx/mr-boxington-action@b3ef673bd77c5426927fe8836c6185cdae04c2dd # v1.7.4
      with:
        backend: ${{ inputs.cache == 'true' && 'github' || 'local' }}
        cache-links: ${{ inputs.cache-links }}
        github-cache-mode: objects
        cache-key: |
          mbx-v3/${{ runner.os }}/${{ runner.arch }}/${{ inputs.cache-scope }}/${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          mbx-v3/${{ runner.os }}/${{ runner.arch }}/${{ inputs.cache-scope }}/
        save-on-workflow-dispatch: true
