# Put setup-turbo after setup-rust and setup-node

name: Set up turborepo
description: Set up turborepo

inputs:
  team:
    description: The Vercel team of the Remote Cache. Pass `vars.TURBO_TEAM`; a composite action cannot read `vars`.
    required: false
    default: ''
  cache:
    description: Whether to restore and save the cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - shell: bash
      run: echo "DO_NOT_TRACK=1" >> $GITHUB_ENV

    # Without a token, turbo runs with the local cache only.
    - continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      if: >-
        inputs.cache == 'true'
        && inputs.team != ''
        && github.repository == 'team-reflect/reflect-open'
      with:
        team: ${{ inputs.team }}
