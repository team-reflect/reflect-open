name: Set up Node.js and pnpm
description: Installs Node.js, pnpm, and dependencies.

inputs:
  cache:
    description: Whether to restore and save the cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The runner image enables OS-level long paths but not git's own support.
    - name: Enable git long paths
      if: runner.os == 'Windows'
      shell: bash
      run: git config --system core.longpaths true

    - name: Install pnpm
      uses: pnpm/setup@v3
      with:
        cache: ${{ inputs.cache }}
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
