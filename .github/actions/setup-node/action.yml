name: Set up Node.js and pnpm
description: Installs Node.js, pnpm, and dependencies.

inputs:
  cache:
    description: Whether to use the pnpm store cache and the turbo remote cache.
    required: false
    default: 'true'
  save-pnpm-cache:
    description: Whether to save the pnpm store cache at the end of the job. Defaults to true only on master.
    required: false
    default: ${{ github.ref == 'refs/heads/master' }}

runs:
  using: composite
  steps:
    # The runner image enables OS-level long paths but not git's own support.
    - name: Enable git long paths
      if: runner.os == 'Windows'
      shell: bash
      run: git config --system core.longpaths true

    - name: Set up environment variables
      shell: bash
      run: |
        echo "DO_NOT_TRACK=1" >> $GITHUB_ENV
        echo "NO_UPDATE_NOTIFIER=1" >> $GITHUB_ENV
        echo "TURBO_CONCURRENCY=1" >> $GITHUB_ENV
        echo "TURBO_LOG_ORDER=stream" >> $GITHUB_ENV

    - name: Install pnpm
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: ${{ inputs.cache }}
        save-cache: ${{ inputs.save-pnpm-cache }}
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check OIDC
      id: oidc
      shell: bash
      run: |
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up turborepo remote cache
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      if: >-
        inputs.cache == 'true'
        && steps.oidc.outputs.available == 'true'
        && github.repository == 'team-reflect/reflect-open'
        && github.event.pull_request.head.repo.fork != true
      with:
        team: team-reflect
