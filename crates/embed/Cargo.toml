[package]
name = "reflect-embed"
version = "0.0.0"
description = "The local embedding model: its pinned spec, the download, and llama.cpp inference."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest = { workspace = true }
reflect-utils = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tracing = { workspace = true }

# Intel macOS and Android use the stand-in in `unsupported.rs`. ggml builds
# Metal for every Apple target, without a feature flag.
[target.'cfg(not(any(target_os = "android", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
llama-cpp-2 = { workspace = true }
llama-cpp-sys-2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt"] }
