[package]
name = "reflect-core"
version = "0.0.0"
description = "The app's commands with no Tauri in them: typed methods on `Core`, a JSON dispatch table, and the `Host` trait a shell implements."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
http-range-header = { workspace = true }
infer = { workspace = true }
reflect-graph-paths = { workspace = true }
# With no `tracing` subscriber, the `log` feature forwards every event to the
# `log` crate, where `logging.rs` or `tauri-plugin-log` owns the sinks.
tracing = { workspace = true, features = ["log"] }
jiff = { workspace = true }
log = { workspace = true, features = ["std"] }
dirs = { workspace = true }
keyring-core = { workspace = true }
reflect-git = { workspace = true }
reflect-graph-io = { workspace = true }
reflect-index = { workspace = true, features = ["native"] }
reflect-index-schema = { workspace = true }
reflect-types = { workspace = true, features = ["reqwest"] }
reflect-utils = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true, features = ["gif", "ico", "jpeg", "png", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "fs", "io-util"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true }
# iCloud (`icloud/`), Contacts (`contacts.rs`), LinkPresentation
# (`link_preview.rs`) and the App Group container (`capture.rs`). dispatch2's
# `MainThreadBound` keeps main-thread-only handles in globals.
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2-contacts = { workspace = true }
objc2-foundation = { workspace = true, features = ["default"] }
objc2-link-presentation = { workspace = true, features = [
  "std",
  "LPLinkMetadata",
  "LPMetadataProvider",
  "block2",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["protected"] }
# Finite-length execution assertions around iOS persistence. UIKit's begin/end
# methods keep file and SQLite locks from surviving process suspension.
block2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIApplication", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

# The file watcher is desktop-only: nothing else writes the mobile sandbox, and
# local writes notify in-process. OS-trash deletes are desktop-only too: mobile
# moves into the graph-local `.reflect/trash/` instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = { workspace = true }
notify-debouncer-full = { workspace = true }
walkdir = { workspace = true }

# The embedding runtime (llama.cpp). Intel macOS and Android use the stand-in in
# `embed_unsupported.rs`. ggml builds Metal for every Apple target, without a
# feature flag.
[target.'cfg(not(any(target_os = "android", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
llama-cpp-2 = { workspace = true }
llama-cpp-sys-2 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
reflect-graph-io = { workspace = true, features = ["test-support"] }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "time"] }
