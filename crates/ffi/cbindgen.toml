# Generates the committed `include/reflect_core.h` for the iOS app.
# `scripts/build-ffi.ts` and CI run cbindgen with this file.
language = "C"
include_guard = "REFLECT_CORE_H"
autogen_warning = "/* Generated by cbindgen from crates/ffi. Do not edit. */"
cpp_compat = true
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
style = "type"
usize_is_size_t = true

[export]
include = ["ReflectCore"]
