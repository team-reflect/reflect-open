[package]
name = "reflect-graph-paths"
version = "0.1.0"
description = "Shared graph-relative path classification for Reflect"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ripgrep's directory walker: per-entry errors, no symlink following, and
# `.gitignore`-style pruning — the properties the vault walk is built on.
ignore = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
