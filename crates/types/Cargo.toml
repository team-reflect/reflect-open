[package]
name = "reflect-types"
version = "0.0.0"
description = "The wire types every Rust crate and the TypeScript frontend share: the error contract, file metadata, file-change batches, and event names."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` and builds the `codegen` bin, which writes the
# TypeScript, Swift, and fixture files. Release builds never enable it.
codegen = [
  "dep:serde_json",
  "dep:specta",
  "dep:specta-serde",
  "dep:specta-swift",
  "dep:specta-typescript",
  "dep:specta-util",
]
git2 = ["dep:git2"]
rusqlite = ["dep:rusqlite"]

[dependencies]
serde = { workspace = true }
# Error conversions for the crates that own these dependencies. Each stays
# optional so a host without libgit2 or SQLite (a wasm build) never links them.
git2 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
specta-serde = { workspace = true, optional = true }
specta-swift = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
specta-util = { workspace = true, optional = true }

[[bin]]
name = "codegen"
required-features = ["codegen"]
