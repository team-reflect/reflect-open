[package]
name = "tauri-plugin-keyboard"
version = "0.1.0"
authors = ["Reflect"]
description = "Native webview input tuning for the Reflect iOS app (keyboard scroll pinning, accessory-bar removal, programmatic-focus keyboard) plus the app's light impact haptic."
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-keyboard"

[dependencies]
tauri = { version = "2.11.5" }
serde = "1.0.228"
thiserror = "2.0.18"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
