packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@post-embed/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list

patchedDependencies:
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch

blockExoticSubdeps: false
overrides:
  '@meowdown/core': https://pkg.pr.new/@meowdown/core@6b309e0
  '@meowdown/react': https://pkg.pr.new/@meowdown/react@6b309e0
  '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@6b309e0
  '@meowdown/embed': https://pkg.pr.new/@meowdown/embed@6b309e0

# Keep these commented examples for future pkg.pr.new testing; do not remove them.
# blockExoticSubdeps: false
