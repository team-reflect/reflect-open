packages:
  - apps/*
  - packages/*
  - design-system
  - scripts

allowBuilds:
  '@sentry/cli': true
  appium-ios-tuntap: false
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@post-embed/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - appium-ios-remotexpc@6.0.4
  - appium-ios-tuntap@3.0.2
  - appium-remote-debugger@19.1.5
  - node-devicectl@3.0.1

patchedDependencies:
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch

# Keep these commented examples for future pkg.pr.new testing; do not remove them.
# blockExoticSubdeps: false
