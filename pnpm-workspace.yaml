packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false
  spawn-sync: true

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@post-embed/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - prosemirror-view

# Development snapshots for meowdown; replace with releases when publishing.
blockExoticSubdeps: false
overrides:
  '@meowdown/core': https://pkg.pr.new/@meowdown/core@40394531dba670677f8dff8231d6550fdcfa36c5
  '@meowdown/react': https://pkg.pr.new/@meowdown/react@40394531dba670677f8dff8231d6550fdcfa36c5
  '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@40394531dba670677f8dff8231d6550fdcfa36c5
