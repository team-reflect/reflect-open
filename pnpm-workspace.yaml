packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false
  spawn-sync: true

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

# The meowdown PR-snapshot builds (pkg.pr.new) reference each other by URL;
# pin every meowdown package to the same snapshot so one copy is installed.
blockExoticSubdeps: false

overrides:
  '@meowdown/core': https://pkg.pr.new/@meowdown/core@533
  '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@533

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - prosemirror-view
  - '@ai-sdk/anthropic@4.0.48'
  - '@ai-sdk/gateway@4.0.72'
  - '@ai-sdk/provider-utils@5.0.36'
  - '@ai-sdk/provider@4.0.10'
  - ai@7.0.90
  - '@ai-sdk/google@4.0.62'
  - '@ai-sdk/openai-compatible@3.0.43'
  - '@ai-sdk/openai@4.0.56'
