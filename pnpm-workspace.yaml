packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false
  spawn-sync: true

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@post-embed/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - prosemirror-view
  - '@ai-sdk/*'
  - ai

# Keep these commented examples for future pkg.pr.new testing; do not remove them.
# blockExoticSubdeps: false
# overrides:
#   '@meowdown/core': https://pkg.pr.new/@meowdown/core@346867e5f1b5336c889e829b146a04fcc0c115c1
#   '@meowdown/react': https://pkg.pr.new/@meowdown/react@346867e5f1b5336c889e829b146a04fcc0c115c1
#   '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@346867e5f1b5336c889e829b146a04fcc0c115c1

# Temporary: prosekit/meowdown#611 (`refreshImages`) until it ships on npm.
blockExoticSubdeps: false
overrides:
  '@meowdown/core': https://pkg.pr.new/@meowdown/core@fe4d5c7f93c31ba1dc95018ac6e6d230565beb11
  '@meowdown/react': https://pkg.pr.new/@meowdown/react@fe4d5c7f93c31ba1dc95018ac6e6d230565beb11
  '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@fe4d5c7f93c31ba1dc95018ac6e6d230565beb11
  '@meowdown/embed': https://pkg.pr.new/@meowdown/embed@fe4d5c7f93c31ba1dc95018ac6e6d230565beb11
