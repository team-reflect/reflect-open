packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  simple-git-hooks: false
  spawn-sync: true

dedupePeers: true

strictPeerDependencies: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@ocavue/*'
  - '@post-embed/*'
  - '@prosemirror-adapter/*'
  - prosemirror-flat-list
  - prosemirror-view

# Development snapshots for the coordinated archive changes; replace with releases when publishing.
blockExoticSubdeps: false
overrides:
  '@post-embed/types': https://pkg.pr.new/@post-embed/types@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@post-embed/schema': https://pkg.pr.new/@post-embed/schema@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@post-embed/exporter': https://pkg.pr.new/@post-embed/exporter@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@post-embed/elements': https://pkg.pr.new/@post-embed/elements@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@meowdown/core': https://pkg.pr.new/@meowdown/core@37e574d8084491a80ea09c12325368e44b5c6989
  '@meowdown/react': https://pkg.pr.new/@meowdown/react@37e574d8084491a80ea09c12325368e44b5c6989
  '@meowdown/markdown': https://pkg.pr.new/@meowdown/markdown@37e574d8084491a80ea09c12325368e44b5c6989
